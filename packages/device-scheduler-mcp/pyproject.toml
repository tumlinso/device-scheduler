[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "device-scheduler-mcp"
version = "0.1.0"
description = "MCP server, SDK, and CLI for Device Scheduler"
requires-python = ">=3.11"
dependencies = [
  "device-scheduler-core>=0.1,<1",
  "device-scheduler-adapters>=0.1,<1",
  "mcp>=1,<2",
  "httpx>=0.27,<1",
  "uvicorn>=0.32,<1",
]

[project.scripts]
device-scheduler = "device_scheduler_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv.sources]
device-scheduler-core = { workspace = true }
device-scheduler-adapters = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
